version: 2
updates:
- package-ecosystem: "pip" # See documentation for possible values
  cooldown:
    default-days: 10 # Fallback cooldown if no specific rule applies
    include:
      - "*"  # Include all dependencies in cooldown
    exclude:
      - "ansys/actions"
  directory: "/"
  schedule:
    interval: "weekly"
  labels:
    - "maintenance"
    - "dependencies"
  commit-message:
      prefix: "build"

- package-ecosystem: "github-actions"
  cooldown:
    default-days: 10 # Fallback cooldown if no specific rule applies
    include:
      - "*"  # Include all dependencies in cooldown
    exclude:
      - "ansys/actions"
  directory: "/"
  schedule:
    interval: "weekly"

- package-ecosystem: "pre-commit"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
    exclude:
    - "ansys/pre-commit-hooks/*"
  labels:
  - "maintenance"
  commit-message:
    prefix: "chore(pre-commit)"
  groups:
    pre-commit-hooks:
      patterns:
      - "*"
  assignees:
  - "phx-mkoninckx"
